; PlatformIO project for the ESP32 services status LED strip.
; Build/upload from VSCode with the PlatformIO IDE extension (see README.md).
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@~3.9.20
    bblanchon/ArduinoJson@^7.0.0
