; PlatformIO project for the ESP32 services status LED strip.
; Build/upload from VSCode with the PlatformIO IDE extension (see README.md).
[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 3.x + FastLED 3.10 outgrow the default 1.25 MB app slot; this gives ~1.9 MB.
board_build.partitions = min_spiffs.csv
lib_deps =
    fastled/FastLED@^3.10.8
    bblanchon/ArduinoJson@^7.4.3
